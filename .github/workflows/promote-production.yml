name: Promote a tested release to Production

# Production is never released automatically. A merge to `main` updates the
# TESTING channel only (see main.yml); this workflow is the single, deliberate
# path by which a frontend reaches app.safehaul.io and safehaul.io.
#
# It promotes an EXACT tested release. The candidate SHA is resolved against the
# Testing deployment record, and the application is copied as the immutable
# Hosting version that Testing already served — not rebuilt from whatever `main`
# points at now. A commit merged five minutes ago therefore cannot ride along
# with a promotion approved an hour ago.
#
# Rollback uses this same workflow: promoting a previously released SHA restores
# that frontend, because its Hosting version is still recorded and still exists.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full 40-character commit SHA of the tested release to promote'
        required: true
        type: string
      reason:
        description: 'Why this release is being promoted (recorded in the audit trail)'
        required: false
        type: string
      request_id:
        description: 'Correlation id supplied by the Super Admin Release Management screen'
        required: false
        type: string

# `workflow_dispatch` returns 204 with no body, so a caller cannot learn the id
# of the run it just started. Putting the correlation id in the run name gives
# the Super Admin screen a deterministic way to find its own run and report real
# progress, instead of guessing "the newest run" and racing a second operator.
run-name: >-
  Promote ${{ inputs.sha }} to Production${{ inputs.request_id && format(' [{0}]', inputs.request_id) || '' }}

jobs:
  promote:
    name: Promote ${{ inputs.sha }} to Production
    runs-on: ubuntu-latest
    # Only the active repository may release. The archived
    # SafeHaul-for-Gemini-Antigravity repository retains this file in its
    # history, so this guard — not a README notice — is what stops a manual run
    # there from touching production.
    if: github.repository == 'Khomurod/SafeHaul'
    concurrency:
      # cancel-in-progress is deliberately FALSE. Cancelling a half-finished
      # production release is far worse than making a second click wait: it could
      # leave the application promoted and the public site not. Queue instead.
      group: firebase-hosting-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      deployments: write
      # An explicit permissions block sets every unlisted scope to `none`, and
      # `resolve-testing-release.mjs` calls GET /commits/{sha}/check-runs, which
      # requires Checks: read. Without this the resolver gets a 403 and NO
      # promotion can ever reach the clone step — a failure whose first
      # appearance would otherwise be the first real production release.
      checks: read
    env:
      FIREBASE_PROJECT_ID: truckerapp-system
      APP_TESTING_SITE: truckerapp-system
      APP_PRODUCTION_SITE: safehaul-app-production

    steps:
      # Checked out at the CANDIDATE SHA, not at main. The public site is
      # deployed from this tree, so the checkout is part of the release contract.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha }}

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      # Runs BEFORE any cloud authentication: an ineligible candidate must fail
      # without a Google credential ever being minted.
      #
      # Workflow inputs are passed through `env:` rather than interpolated into
      # the shell. `${{ inputs.x }}` is substituted into the script *before* the
      # shell runs, so a crafted value becomes shell source; going via the
      # environment keeps it data. Only someone with write access can dispatch
      # this, but this workflow releases production and should not rely on that.
      - name: Resolve and verify the tested release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: node scripts/resolve-testing-release.mjs "$CANDIDATE_SHA"

      - name: Skip — production already serves this release
        if: steps.release.outputs.already_live == 'true'
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: echo "Production is already live on $CANDIDATE_SHA. Nothing to do."

      - name: Authenticate to Google Cloud
        if: steps.release.outputs.already_live != 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/725898258453/locations/global/workloadIdentityPools/safehaul-github/providers/safehaul-github-provider
          service_account: safehaul-github-deployer@truckerapp-system.iam.gserviceaccount.com
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      # Root lockfile pins firebase-tools; without this npx fetches a random CLI.
      - name: Install repo dependencies (Firebase CLI from package-lock)
        if: steps.release.outputs.already_live != 'true'
        run: npm ci

      # THE APPLICATION: promoted as bytes, not as source.
      #
      # `SITE@VERSION_ID` clones one specific immutable Hosting version, so this
      # copies precisely what Testing served and verified. It is also why no
      # rebuild happens here — a rebuild could differ from the tested artifact
      # even from an identical commit.
      #
      # The `@` form is not interchangeable with the `:` form. firebase-tools
      # parses `<site>:<something>` as a CHANNEL source and only falls through to
      # the version parser when the colon split fails, so `site:@version` looks
      # for a channel literally named `@version` and errors out. The pinned CLI's
      # own message is explicit: `Must be in the form "<site>:<channel>" or
      # "<site>@<version>"`. Verified against
      # node_modules/firebase-tools/lib/commands/hosting-clone.js at 15.3.1.
      #
      # Safe to clone because the `testing` and `production` app targets have
      # byte-identical Hosting config, and the bundle is host-agnostic: apply
      # links derive from window.location.origin, so the same artifact emits
      # app.safehaul.io links on production and truckerapp-system.web.app links
      # on Testing.
      - name: Promote the application (exact Hosting version)
        if: steps.release.outputs.already_live != 'true'
        env:
          APP_VERSION_ID: ${{ steps.release.outputs.app_version_id }}
        run: |
          npx firebase hosting:clone \
            "$APP_TESTING_SITE@$APP_VERSION_ID" \
            "$APP_PRODUCTION_SITE:live" \
            --project "$FIREBASE_PROJECT_ID" --non-interactive

      # THE PUBLIC SITE: deployed from the same SHA, NOT cloned.
      #
      # The two public targets have deliberately different Hosting config: the
      # testing site sends `X-Robots-Tag: noindex, nofollow` so it stays out of
      # search results. Cloning it onto safehaul.io would carry that header over
      # and de-index the testing site. So the public site is deployed from the
      # approved commit using the production target's own config. It is static
      # content under `web/`, so the result is fully determined by the SHA.
      - name: Promote the public site (from the approved SHA)
        if: steps.release.outputs.already_live != 'true'
        run: |
          npx firebase deploy --only hosting:landing-production \
            --project "$FIREBASE_PROJECT_ID" --non-interactive

      # Independent confirmation that the bytes now on app.safehaul.io really are
      # the approved release, read back from the live site rather than assumed
      # from a successful CLI exit code.
      - name: Verify the live production release
        if: steps.release.outputs.already_live != 'true'
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
        run: node scripts/verify-live-release.mjs https://app.safehaul.io "$CANDIDATE_SHA"

      - name: Record the production release
        if: steps.release.outputs.already_live != 'true'
        env:
          APP_VERSION_ID: ${{ steps.release.outputs.app_version_id }}
          LANDING_VERSION_ID: ${{ steps.release.outputs.landing_version_id }}
          RELEASE_CHANNEL: production
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The promotion is dispatched from main but releases the candidate, so
          # the release identity is passed explicitly rather than inherited.
          RELEASE_SHA: ${{ inputs.sha }}
        run: node scripts/record-release.mjs

      # `reason` is free text typed by a human, so it never reaches the shell as
      # source. Everything here goes through the environment.
      - name: Summarise the promotion
        if: always()
        env:
          CANDIDATE_SHA: ${{ inputs.sha }}
          APP_VERSION_ID: ${{ steps.release.outputs.app_version_id }}
          APPROVED_BY: ${{ github.actor }}
          PROMOTION_REASON: ${{ inputs.reason }}
          REQUEST_ID: ${{ inputs.request_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Production promotion"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Candidate SHA | \`$CANDIDATE_SHA\` |"
            echo "| Hosting version | \`${APP_VERSION_ID:-not resolved}\` |"
            echo "| Request id | \`${REQUEST_ID:-dispatched manually}\` |"
            echo "| Approved by | @$APPROVED_BY |"
            echo "| Reason | ${PROMOTION_REASON:-_not given_} |"
            echo "| Result | $JOB_STATUS |"
          } >> "$GITHUB_STEP_SUMMARY"
