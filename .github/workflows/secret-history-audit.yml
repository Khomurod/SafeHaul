name: Secret history audit

# The full-history sweep, on purpose and on its own.
#
# `main.yml`'s `secret-scan` job answers "does this change introduce a secret?"
# and blocks the release when it does. This workflow answers the different
# question — "what is in the repository's history?" — whose answer is a fixed,
# known, inventoried set of eight values from 2025-12..2026-03.
#
# Those two questions shared one job until 2026-08-26, and the cost was that
# every `workflow_dispatch` re-verification of an already-merged commit scanned
# all 256 commits, reported the same legacy findings, failed `release-validation`
# and skipped both deploys. Run #159 on `8c3315d` is the example.
#
# So the sweep lives here, where it can be as thorough as it likes:
#
#   - it is NOT in `release-validation`'s `needs`, so it cannot block a deploy;
#   - it is not silent either — it fails when history gets WORSE than the
#     recorded baseline, which is the only outcome that needs a human;
#   - findings are redacted, and only rule/path/line/commit/date are ever
#     emitted, here or in the artifact.
#
# Classification, severity and the rotations that remain the owner's:
# docs/SECRET_HISTORY_AUDIT.md.

on:
  schedule:
    # Weekly, Monday. Deliberately off the hour — GitHub queues scheduled
    # workflows and the top of the hour is the busiest slot.
    - cron: '43 6 * * 1'
  workflow_dispatch:

concurrency:
  group: secret-history-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Inventory every secret in every commit
    runs-on: ubuntu-latest
    steps:
      # Every commit on every ref: a secret parked on a branch nobody merged is
      # still in the repository.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch all refs
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      - name: Audit
        env:
          SECRET_HISTORY_REPORT_DIR: ${{ runner.temp }}/secret-history
        run: node scripts/secret-history-audit.mjs

      - name: Upload the redacted history inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-history-audit
          path: ${{ runner.temp }}/secret-history
          if-no-files-found: ignore
