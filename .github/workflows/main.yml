name: CI/CD Pipeline

# ## Shape of this pipeline
#
# A pull request is the comprehensive quality gate: it runs every lane its change
# can possibly affect, against the exact merge result GitHub will land.
#
# A merge to `main` does NOT repeat that suite when it can prove it would be
# running the same tests over the same bytes. The proof is a git tree hash — see
# `scripts/ci-plan.mjs` — and where the proof is absent, the lane runs. Then
# `release-validation` independently confirms that every lane either executed
# here or is provably covered, and that job is what the production promotion gate
# requires by name. Nothing downstream of it — the Testing deploy, the shared
# backend rollout, the release record, the promotion gate — can start until it
# has said yes.
#
# The failure direction is deliberate throughout: an unreadable diff, an
# unclassified path, a missing attestation, a cancelled run or a planner that
# crashed all produce MORE testing, never less.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      source_size_base:
        description: >-
          Optional baseline commit for the source-size guard. Leave it empty and
          the guard compares against the newest ancestor carrying a fully
          validated release, which it asks GitHub for. Set it only when that walk
          finds nothing and you can name a release you know was good. It clears a
          HIGHER bar than an inferred base, because an escape hatch nobody checks
          is a bypass: an ancestor, not the head, itself carrying a validated
          release, containing the base the walk would have chosen, and not from
          before the source-size backlog existed.
        required: false
        default: ''
      secret_scan_base:
        description: >-
          Optional baseline commit for secret-scan. Leave empty and the scan
          compares against the newest ancestor carrying a fully validated
          release — one run where both secret-scan and "Verify the release is
          fully validated" passed — which it asks GitHub for. Set it to reach
          PAST that automatic walk: an older release you know was validated. It
          is resolved to its full SHA, must be an ancestor of the ref being run
          and not the ref itself, and must itself carry a validated release. It
          names a release known to be good; it cannot invent one.
        required: false
        type: string

# Superseded pull-request runs are cancelled — pushing a fixup should not leave a
# stale 10-minute suite occupying runners.
#
# Pushes to `main` are deliberately NOT grouped together: `github.run_id` is
# unique per run, so a main run is always alone in its group and can never be
# cancelled by the next merge. Cancelling a main run mid-deploy could leave the
# Testing frontend and the shared backend at different versions.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # What this run has to do
  # ---------------------------------------------------------------------------
  plan:
    name: Plan this run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads the attestation artifacts that prove a lane already passed against
      # this exact source tree. Read-only: this job never writes one.
      actions: read
    outputs:
      tree_sha: ${{ steps.plan.outputs.tree_sha }}
      full_suite: ${{ steps.plan.outputs.full_suite }}
      selection_reason: ${{ steps.plan.outputs.selection_reason }}

      # THE authoritative decision, as one json document. `release-validation`
      # reads this and nothing else. It is deliberately not split per lane: a plan
      # reassembled from a dozen separate outputs fails open, because one missing
      # output reads as "that lane was not relevant". See `scripts/ci-plan.mjs`.
      lane_plan: ${{ steps.plan.outputs.lane_plan }}

      # Scheduling hints for the `if:` conditions below, which cannot parse json.
      # Advisory only: a missing one just means the lane does not run, and the
      # lane plan still reports it as required, so the gate refuses.
      run_frontend_build: ${{ steps.plan.outputs.run_frontend_build }}
      run_frontend_unit: ${{ steps.plan.outputs.run_frontend_unit }}
      run_frontend_e2e: ${{ steps.plan.outputs.run_frontend_e2e }}
      run_storybook: ${{ steps.plan.outputs.run_storybook }}
      run_functions: ${{ steps.plan.outputs.run_functions }}
      run_rules: ${{ steps.plan.outputs.run_rules }}
    steps:
      # Full history: the planner diffs against the pull request's base or the
      # push's previous head, and a shallow clone has neither. A planner that
      # cannot read the diff falls back to the full suite, so a shallow clone
      # here would silently cost ~20 minutes per run rather than break anything.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      # No `npm ci`: the planner uses only Node builtins, deliberately, so the
      # first job of every run does not wait on an install.
      - name: Decide which lanes must run
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-plan.mjs

  # ---------------------------------------------------------------------------
  # Always run — cheap, or not determined by the source tree
  # ---------------------------------------------------------------------------
  secret-scan:
    runs-on: ubuntu-latest
    # NEVER skippable, and never provable by a tree hash: this job scans commit
    # HISTORY, and two commits with an identical tree can have entirely different
    # history. A merge introduces new commits, so it needs a new scan.
    #
    # It used to be `gitleaks/gitleaks-action@v2`, which chose the range from the
    # event and got it wrong three different ways — on `workflow_dispatch` it
    # passed no range at all and scanned every commit in the repository, so run
    # #159 on `8c3315d` failed on 67 findings from 2025-12..2026-03 and skipped
    # both deploys. `scripts/secret-scan.mjs` owns the range instead, pins the
    # scanner by version and digest, and fails closed when it cannot determine a
    # base. Its docblock records what was measured; AGENTS.md ("Changing the
    # release pipeline", rule 4) records the rule.
    permissions:
      contents: read
      # Read-only, and only for one question: did an earlier commit carry a
      # fully validated release — both `secret-scan` and `release-validation`
      # green in one run? That is what everything but a pull request compares
      # against, because git cannot say whether CI ever passed.
      checks: read
    steps:
      # Full history: the scanner resolves base..head itself, and a merge needs
      # both parents' ancestry to be present.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Scan what this change introduces, and the tree it produces
        env:
          # Empty on push and pull_request; only a dispatch can set it.
          SECRET_SCAN_BASE: ${{ inputs.secret_scan_base }}
          SECRET_SCAN_REPORT_DIR: ${{ runner.temp }}/secret-scan
          # Used only to ask which ancestor was last validated. The scan itself
          # reads the event payload off disk and needs no token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/secret-scan.mjs
      # Redacted by construction: rule, file, line and commit only, never a value.
      - name: Upload the redacted secret-scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-report
          path: ${{ runner.temp }}/secret-scan
          if-no-files-found: ignore

  callable-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The source-size guard asks which ancestor last carried a fully validated
      # release, which is a check-runs query. Read-only, and the same grant
      # `secret-scan` carries for the same lookup.
      checks: read
    # Always runs. It is ~20 seconds and it is the self-test for the release
    # system itself — the promotion gate, and the CI planner and validation gate
    # that decide what may be skipped. Making the checks that guard the
    # optimisation skippable by the optimisation would be circular.
    steps:
      # Full history: the source-size guard proves the backlog did not grow by
      # reading its previous version out of git, and a depth-1 checkout has no
      # previous version to read. Without this the guard refuses (which is the
      # designed behaviour) rather than passing on an unverified backlog.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Verify frontend/backend callable contract
        run: node scripts/check-callable-contract.mjs

      # The public site's claims gate. `npm run check:public-claims` holds every
      # `web/*.html` to `functions/ai/knowledge/safehaulCapabilities.js`, and it
      # was reachable only through the root `npm run lint`, which CI never runs —
      # a gate that was documented, not wired. It lives HERE, not in a lane,
      # because it has two inputs and a lane can skip on either: a `web/` change
      # selects `frontend_unit`, but a registry change selects only `functions`,
      # and either can make the live page newly wrong. This job runs on every
      # push and pull request with no `npm ci`, and the checker needs nothing
      # installed. `K4` in `npm run check:ci-plan` pins all of that, and refuses
      # a page in a subdirectory the checker does not scan.
      - name: Public-claims check
        run: npm run check:public-claims

      # The promotion gate decides what may reach app.safehaul.io, so its refusal
      # paths are a required check rather than a nicety.
      - name: Verify the production-promotion gate
        run: npm run check:release-scripts

      # And the same for the machinery that decides what CI is allowed to skip:
      # path selection, the conservative fallbacks, provenance, and the
      # fail-closed verdict.
      - name: Verify the CI plan and release-validation gate
        run: npm run check:ci-plan

      # The secret scanner's SCOPE is the thing that broke, so its scope has a
      # test: which commits each event compares against, and which secrets that
      # range does and does not catch. It runs the real pinned gitleaks over
      # throwaway repositories, and it belongs here rather than in a skippable
      # lane for the same reason as the two checks above — a security gate whose
      # own tests CI may skip is not a gate.
      - name: Verify the secret scanner's range selection and detection
        run: npm run test:secret-scan

      # Physical line counts across every handwritten source file, and the guard
      # that stops a new one arriving over the limit. It lives in this job for
      # the same reason as the checks above: `callable-contract` is in
      # `ALWAYS_REQUIRED_JOBS`, so no tree-hash proof can skip it, and a size
      # standard CI may skip is not a standard. Its own tests run first — a
      # scanner that has silently stopped looking reports a shorter list, and a
      # shorter list reads as progress.
      - name: Verify the source-size guard
        run: npm run test:source-size

      # `--require-baseline` is what stops the backlog being edited into an
      # allowlist. The three backlog rules are enforced against the backlog in
      # the branch under test, which that branch may edit, so the guard also
      # reads the previous version out of git and refuses any entry added or any
      # recorded count raised. A run that cannot find that previous version
      # refuses too, here — there is no skip path where tampering is the concern.
      - name: Check source sizes
        run: npm run check:source-size -- --require-baseline
        env:
          # Asking "which ancestor last carried a fully validated release" needs a
          # token and `checks: read`, declared on this job above. It is the same
          # question `scripts/secret-scan.mjs` and `scripts/resolve-deploy-base.mjs`
          # both ask, for the same reason: `github.event.before` is only as good as
          # the run that happened on it, and after a FAILED push it IS the failure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A pull request measures against what it was proposed against — a
          # definition, so it needs no validated-release proof. Every other event
          # asks GitHub.
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          # An operator naming a base on a manual run, for when the walk finds
          # nothing. It clears a HIGHER bar than an inferred base — an ancestor, not
          # the head, carrying a validated release, containing whatever the walk
          # would have chosen, and not from before the backlog existed — because an
          # escape hatch nobody checks is a bypass, measured four times now.
          SOURCE_SIZE_BASE: ${{ github.event.inputs.source_size_base || '' }}

      # The shared AI platform is only worth having if it cannot be bypassed,
      # and this guard is what stops a feature growing its own vendor call. It
      # was written, documented in four places as `npm run check:ai-boundary`,
      # and then never wired to anything — so until 2026-08-08 it had never
      # actually run. It belongs here rather than in a skippable lane: it takes
      # under a second, needs no install, and a boundary guard that CI is
      # allowed to skip is a boundary guard that eventually stops holding.
      - name: Verify the AI provider boundary
        run: npm run check:ai-boundary

  # ---------------------------------------------------------------------------
  # Lanes — each runs when relevant and not already proven for this exact tree
  # ---------------------------------------------------------------------------
  test-functions:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run_functions == 'true'
    defaults:
      run:
        working-directory: ./functions

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run_frontend_build == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  frontend-quality:
    # Frontend lint plus unit tests and the coverage baseline-ratchet gate.
    #
    # The browser suite used to run in this same job, one step after these, which
    # made a single ~23-minute serial job the critical path of every pull request
    # AND every merge. It now runs in `frontend-e2e`, sharded across runners. No
    # test was removed in the split; measured 2026-08-07, this job's own work is
    # 6–8.5 minutes of it.
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run_frontend_unit == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Lint
        run: npm run lint:frontend

      # The design-system ratchet. It measures the tree against a committed
      # inventory and fails on anything the inventory does not already cover, so
      # a new raw palette class, off-scale type size, sub-12px text or
      # hand-built control cannot land. It is here rather than in its own job
      # because it needs nothing but a checkout and `npm ci` — and because a new
      # job below `plan` would have to re-derive the skip-propagation clauses
      # this pipeline documents at length.
      - name: UI contract ratchet
        run: npm run check:ui-contract

      - name: Frontend Unit Tests + Coverage (baseline-ratchet gate)
        run: npm run test:coverage

  frontend-e2e:
    name: E2E shard ${{ matrix.shard }} of 4 (Chromium)
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run_frontend_e2e == 'true'
    strategy:
      # Every shard reports. A red shard fails the lane either way, and knowing
      # whether one spec broke or forty is the difference between a five-minute
      # diagnosis and a re-run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # Chromium is ~150MB and `playwright install` downloads it over the public
      # internet. Measured on 2026-08-07 that step took 24 seconds on one run and
      # 10 minutes 32 seconds on another — an unbounded cost on the critical path,
      # for a binary pinned by the lockfile. Caching it makes the cost bounded.
      #
      # Browsers only. No credential, token or build output is cached here.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser, not the system libraries it links against,
      # so those are still installed on a cache hit.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Sharding splits the suite ACROSS runners; it does not raise `workers`
      # within one. Each shard gets its own machine, its own dev server and its
      # own port 5000, so the shared-dev-server hazard documented in CLAUDE.md
      # ("CI Playwright concurrency: workers: 1 is deliberate") does not apply —
      # that hazard is two suites contending for one server on one machine.
      # `workers: 1` and `retries: 2` are untouched.
      #
      # The @axe accessibility specs run HERE, in this blocking lane, since
      # 2026-08-25. They used to be excluded with `--grep-invert "@a11y"` and run
      # in a separate `continue-on-error` job, whose own comment said to fold them
      # back in "once confirmed green in CI". They were: 11/11 passed on the last
      # run of the campaign that wrote that comment, and on every run before it.
      #
      # An accessibility gate nobody has to pass is a report, not a gate — and the
      # roadmap requires accessibility to be enforced. `scripts/test-ci-plan.mjs`
      # (K2) asserts no workflow step excludes `@a11y`, so it cannot drift back
      # out.
      - name: Frontend E2E Tests (Chromium, including the axe specs)
        run: npm run test:e2e -- --project=chromium --shard=${{ matrix.shard }}/4

  storybook-build:
    name: Build the design-system catalog
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run_storybook == 'true'
    # The Storybook catalog documents the design system and business-neutral page
    # patterns only. It imports no Firebase, no application context and no domain
    # services, and every value it renders comes from hand-written local fixtures.
    #
    # So this job is deliberately given NO credentials: the workflow-level VITE_*
    # secrets are blanked below rather than inherited. That is the guarantee, not
    # a precaution — if this build ever starts needing a secret, something has
    # been imported into the catalog that does not belong there, and this job
    # failing is the correct outcome.
    #
    # The visual lane's application screens run here too, and they run against
    # `VITE_E2E_TEST_MODE=1` fixture data with these same secrets blank — which
    # is the point: if a screenshot of a real screen ever needs a credential to
    # render, that is a finding, not a configuration problem.
    env:
      VITE_FIREBASE_API_KEY: ''
      VITE_FIREBASE_AUTH_DOMAIN: ''
      VITE_FIREBASE_PROJECT_ID: ''
      VITE_FIREBASE_STORAGE_BUCKET: ''
      VITE_FIREBASE_MESSAGING_SENDER_ID: ''
      VITE_FIREBASE_APP_ID: ''
      VITE_FACEBOOK_APP_ID: ''
      VITE_SENTRY_DSN: ''
      VITE_SUPER_ADMIN_EMAIL: ''
      VITE_DRIVER_APP_URL: ''
      VITE_SOCRATA_APP_TOKEN: ''
      PROCESS_BULK_BATCH_URL: ''
      BULK_WORKER_SECRET: ''
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      # `npm ci` (not `npm install`) so the catalog is built from the committed
      # lockfile and cannot drift from what was reviewed.
      - name: Install Dependencies
        run: npm ci

      # `storybook build` bundles stories but does not execute them, so a story
      # that throws at render would still produce a green build. This step renders
      # every story and runs axe over it, and guards against the story glob
      # silently resolving to nothing.
      - name: Story render + accessibility checks
        run: npm run test:stories

      - name: Build Storybook
        run: npm run build-storybook

      # Layout defects need a layout engine. jsdom has none — `scrollWidth` and
      # `offsetWidth` are always 0 there — so the step above and every unit test
      # in the repository are structurally unable to see a cell overflowing its
      # column or a table unable to paint to its own edge. This measures the
      # built catalog in a real browser instead. It found both defects it was
      # written for on the tree that shipped them.
      #
      # It reuses the same browser the E2E lane caches, so the download is the
      # one already pinned by the lockfile rather than a second copy.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # The cache holds the browser, not the system libraries it links against.
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Table layout check
        run: npm run check:table-layout

      # Computed geometry — control heights, cell padding, radii, resolved token
      # colours — measured in a real browser and compared to a committed
      # snapshot. Blocking, because the numbers are portable across machines and
      # a failure names exactly what moved ("button[md].height: 44px -> 40px")
      # rather than showing a diff of pixels.
      - name: Visual contract (geometry)
        run: npm run check:visual-contract

      # Pixel baselines. BLOCKING since 2026-08-25, and the history is the reason
      # it has to stay that way.
      #
      # It ran with `continue-on-error: true` on the stated grounds that the
      # catalog did not load Inter, so text rasterised with whatever the runner's
      # `sans-serif` resolved to. The CI record said something else: the 130
      # catalog baselines passed here every time, and all 20 APPLICATION
      # baselines failed every time, because the application fetched Inter from
      # rsms.me and this runner never received it. The lane had never once been
      # green, its 52MB diff artifact was uploaded and ignored, and the warning
      # annotation below said "a pixel baseline changed" on every single run.
      #
      # A lane that always fails teaches everyone to ignore it, which is worse
      # than no lane. The font is served from the repository now, so there is no
      # machine-dependent input left and this is enforced.
      #
      # `scripts/test-ci-plan.mjs` (K1) asserts this step carries no
      # `continue-on-error`, so it cannot quietly go back to advisory.
      - name: Visual regression (pixel baselines)
        id: visual-regression
        run: npm run test:visual

      # The step above fails the job now, so this needs `always()` to run at all —
      # and the artifact is more valuable than ever, because a red lane is now a
      # blocked merge and the diff is how you triage it.
      - name: Upload the visual diff
        if: always() && steps.visual-regression.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diff
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Say so when the visual lane moved
        if: always() && steps.visual-regression.outcome == 'failure'
        run: |
          echo "::error title=Visual baselines moved::A pixel baseline changed. Download the"\
               "visual-regression-diff artifact. If the change is intended, run"\
               "'npm run test:visual:update' and commit the baselines."

      - name: Upload the static catalog
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14
          if-no-files-found: error

  rules-emulator:
    runs-on: ubuntu-latest
    needs: plan
    # Security rules live in `src/firestore.rules` / `src/storage.rules`, and both
    # are classified cross-cutting by the planner, so any change to them runs the
    # whole suite including this lane. This `if:` only skips the lane for changes
    # that cannot touch rules at all.
    if: needs.plan.outputs.run_rules == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulator jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install Dependencies
        run: npm ci

      - name: Run Firestore/Storage rules tests with emulators (5x flake guard)
        env:
          RULES_STRESS_LOOPS: '5'
        run: npm run test:rules:stress

      - name: Upload emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rules-emulator-logs
          if-no-files-found: ignore
          path: |
            firestore-debug.log
            firebase-debug.log
            storage-debug.log
            ui-debug.log

  # ---------------------------------------------------------------------------
  # Non-blocking baselines — advisory, never in the required set
  #
  # `e2e-a11y` used to live here and no longer does: its axe specs run inside the
  # blocking `frontend-e2e` lane as of 2026-08-25. `typecheck` is the only
  # advisory lane left, and it is advisory for a different reason — it is a
  # ratchet over pre-existing `checkJs` findings in modules this campaign does not
  # touch, not a gate someone decided to switch off.
  # ---------------------------------------------------------------------------
  typecheck:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run_frontend_unit == 'true'
    # D3: non-blocking type-safety baseline (checkJs on scoped high-leverage
    # modules via jsconfig.json). Surfaces latent type issues to ratchet over
    # time; intentionally NOT part of the release-validation lane set so it never
    # blocks a release.
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck (non-blocking baseline)
        run: npm run typecheck
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # THE gate
  # ---------------------------------------------------------------------------
  release-validation:
    name: Verify the release is fully validated
    runs-on: ubuntu-latest
    # `always()` is load-bearing. This job has to produce a verdict when an
    # upstream lane FAILED or the run was cancelled — those are exactly the cases
    # a promotion must refuse, and a verdict that never appears would leave the
    # promotion gate reading "no failure recorded". It is required by name in
    # `functions/releaseManagement/eligibility.js`, so a missing verdict refuses
    # every promotion.
    if: always()
    needs:
      - plan
      - secret-scan
      - callable-contract
      - test-functions
      - frontend-build
      - frontend-quality
      - frontend-e2e
      - storybook-build
      - rules-emulator
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      # Each lane must be accounted for: it ran green here, or it was skipped
      # with a reason this job can verify. Anything else fails.
      #
      # `LANE_PLAN` is passed through verbatim as the single json value the planner
      # produced. If the plan job failed it is empty, the script cannot parse it,
      # and the release is refused — the planner's own result is checked too.
      - name: Verify every lane ran or is provably covered
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          LANE_PLAN: ${{ needs.plan.outputs.lane_plan }}
          JOB_RESULTS: >-
            {
              "secret-scan": "${{ needs.secret-scan.result }}",
              "callable-contract": "${{ needs.callable-contract.result }}",
              "test-functions": "${{ needs.test-functions.result }}",
              "frontend-build": "${{ needs.frontend-build.result }}",
              "frontend-quality": "${{ needs.frontend-quality.result }}",
              "frontend-e2e": "${{ needs.frontend-e2e.result }}",
              "storybook-build": "${{ needs.storybook-build.result }}",
              "rules-emulator": "${{ needs.rules-emulator.result }}"
            }
        run: node scripts/verify-release-validation.mjs

      # ----------------------------------------------------------------------
      # Attestations
      # ----------------------------------------------------------------------
      # Published only from a pull request, and only past the verification step
      # above — a failing gate never attests anything.
      #
      # The PROOF is the artifact's name and the run that produced it, both of
      # which only GitHub can set. The file below is a human-readable receipt for
      # whoever is reading a release later; `scripts/ci-plan.mjs` never parses it,
      # so its contents cannot influence what a later run decides to skip.
      - name: Write the validation receipt
        if: github.event_name == 'pull_request'
        env:
          TREE_SHA: ${{ needs.plan.outputs.tree_sha }}
        run: |
          cat > validation-receipt.json <<JSON
          {
            "tree": "$TREE_SHA",
            "validatedSha": "$GITHUB_SHA",
            "runId": "$GITHUB_RUN_ID",
            "repository": "$GITHUB_REPOSITORY",
            "pullRequest": "${{ github.event.pull_request.number }}"
          }
          JSON

      - name: Attest frontend_build
        if: github.event_name == 'pull_request' && needs.frontend-build.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ needs.plan.outputs.tree_sha }}-frontend_build
          path: validation-receipt.json
          retention-days: 14
          if-no-files-found: error

      - name: Attest frontend_unit
        if: github.event_name == 'pull_request' && needs.frontend-quality.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ needs.plan.outputs.tree_sha }}-frontend_unit
          path: validation-receipt.json
          retention-days: 14
          if-no-files-found: error

      - name: Attest frontend_e2e
        if: github.event_name == 'pull_request' && needs.frontend-e2e.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ needs.plan.outputs.tree_sha }}-frontend_e2e
          path: validation-receipt.json
          retention-days: 14
          if-no-files-found: error

      - name: Attest storybook
        if: github.event_name == 'pull_request' && needs.storybook-build.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ needs.plan.outputs.tree_sha }}-storybook
          path: validation-receipt.json
          retention-days: 14
          if-no-files-found: error

      - name: Attest functions
        if: github.event_name == 'pull_request' && needs.test-functions.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ needs.plan.outputs.tree_sha }}-functions
          path: validation-receipt.json
          retention-days: 14
          if-no-files-found: error

      - name: Attest rules
        if: github.event_name == 'pull_request' && needs.rules-emulator.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ needs.plan.outputs.tree_sha }}-rules
          path: validation-receipt.json
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  deploy-testing:
    name: Deploy the Testing release
    runs-on: ubuntu-latest
    needs:
      - release-validation
    # SafeHaul has exactly one active source repository. The deploy jobs used to
    # pick their Hosting target from `github.repository`, because the same files
    # lived in two repositories and each deployed its own pair of sites. That is
    # retired: `Khomurod/SafeHaul` is now the only repository that may deploy,
    # and a merge to its `main` only ever updates the TESTING channel.
    #
    # The repository guard is deliberately an `if:` on the job rather than a note
    # in a runbook. `SafeHaul-for-Gemini-Antigravity` keeps this workflow file in
    # its history, so without the guard someone could still open that archived
    # repository and press "Run workflow" to deploy from stale source. With it,
    # those jobs skip immediately and no Google credential is ever requested.
    #
    # `!cancelled()` and the `release-validation` clause are a PAIR. Removing
    # either one breaks this job, in opposite directions.
    #
    # A skip propagates down the WHOLE dependency chain, not just one level.
    # `release-validation` declares `if: always()`, so it runs even when every
    # lane was skipped — but `always()` only un-skips the job that declares it.
    # It does not clear the skip for anything downstream. So when provenance
    # proved every lane and they all skipped, this job was skipped too, before
    # its condition was ever considered: main deployed nothing, and the release
    # was correctly left un-promotable. That is what a60c6dc did.
    #
    # `!cancelled()` opts out of that inherited skip. It also disables the
    # implicit "all needs succeeded" check, which is exactly why the explicit
    # `needs.release-validation.result == 'success'` below is load-bearing
    # rather than belt-and-braces: it is now the only thing standing between a
    # failed gate and a deploy. `scripts/test-ci-plan.mjs` asserts both are
    # present, together, for that reason.
    if: >-
      !cancelled() &&
      github.repository == 'Khomurod/SafeHaul' &&
      needs.release-validation.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      # Serialised against itself, but NOT against a production promotion — the
      # two touch different Hosting sites and must not cancel one another.
      group: firebase-hosting-testing
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      # Records the release (and its pinned Hosting version IDs) that a later
      # production promotion is allowed to copy.
      deployments: write
    outputs:
      # Handed to `release-ready`, which is the only job allowed to mark this
      # record promotable.
      deployment_id: ${{ steps.record.outputs.deployment_id }}
    env:
      FIREBASE_PROJECT_ID: truckerapp-system
      FIREBASE_HOSTING_TARGET: testing
      FIREBASE_LANDING_TARGET: landing-testing

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/725898258453/locations/global/workloadIdentityPools/safehaul-github/providers/safehaul-github-provider
          service_account: safehaul-github-deployer@truckerapp-system.iam.gserviceaccount.com
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          # Needed to read back the Hosting version ID that this deploy created.
          # Keyless: minted from the same WIF exchange, no service-account JSON.
          token_format: access_token

      - name: Load browser settings from Google Secret Manager
        id: browser-settings
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            VITE_FACEBOOK_APP_ID:truckerapp-system/VITE_FACEBOOK_APP_ID
            VITE_SENTRY_DSN:truckerapp-system/VITE_SENTRY_DSN
            VITE_SOCRATA_APP_TOKEN:truckerapp-system/VITE_SOCRATA_APP_TOKEN

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        env:
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_FACEBOOK_APP_ID: ${{ steps.browser-settings.outputs.VITE_FACEBOOK_APP_ID }}
          VITE_SENTRY_DSN: ${{ steps.browser-settings.outputs.VITE_SENTRY_DSN }}
          VITE_SOCRATA_APP_TOKEN: ${{ steps.browser-settings.outputs.VITE_SOCRATA_APP_TOKEN }}
        run: npm run build

      # E1: Never publish *.map files to Firebase Hosting (no public source disclosure).
      # Runs unconditionally, after any upload and before deploy.
      - name: Strip sourcemaps from deploy artifact
        run: find dist -name '*.map' -delete

      # A promotion has to prove *which source* produced the bytes it is about to
      # copy to production. `VITE_RELEASE_SHA` is compiled into the bundle, which
      # is not readable without parsing hashed chunks, so the same value is also
      # written as a plain static file. It is served by the deployed site itself,
      # which makes the currently-live SHA independently checkable by anyone —
      # the promotion workflow, the runbook, or a human with curl.
      - name: Stamp the release manifest
        run: node scripts/write-release-manifest.mjs dist "$GITHUB_SHA"

      # The second target's alias and site ID still say `landing`: a Firebase
      # Hosting site cannot be renamed, and `landing_version_id` below is a field
      # in the persisted release record that the Production promotion gate reads.
      # It serves `web/` — the blog's assets and the privacy page.
      - name: Deploy the app and public Hosting sites
        run: npx firebase deploy --only "hosting:$FIREBASE_HOSTING_TARGET,hosting:$FIREBASE_LANDING_TARGET" --project "$FIREBASE_PROJECT_ID" --non-interactive

      # Capture the immutable Hosting version IDs this deploy just created.
      #
      # This is what makes "promote the exact tested build" true rather than
      # aspirational. Firebase Hosting versions are immutable, so pinning the ID
      # here means a promotion later clones *these* bytes even if `main` has moved
      # on and Testing has been redeployed several times in between.
      - name: Record the deployed Testing version IDs
        id: versions
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node scripts/read-hosting-release.mjs truckerapp-system app >> "$GITHUB_OUTPUT"
          node scripts/read-hosting-release.mjs safehaul-landing-testing landing >> "$GITHUB_OUTPUT"

      # Recorded as `in_progress`, NOT `success`.
      #
      # The promotion gate treats a successful Testing deployment record as "this
      # entire release shipped", and at this point it has not: the rules, index
      # and Cloud Functions rollouts below and in `deploy-functions` are shared
      # backend that Production runs against too. The `release-ready` job marks
      # this record `success` once all of that has passed. Until then the release
      # exists and is visible, but nothing can promote it.
      - name: Publish the release record
        id: record
        env:
          APP_VERSION_ID: ${{ steps.versions.outputs.app_version_id }}
          LANDING_VERSION_ID: ${{ steps.versions.outputs.landing_version_id }}
          RELEASE_CHANNEL: testing
          RELEASE_STATE: in_progress
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/record-release.mjs

      # Rules, Storage and indexes are SHARED backend policy: Testing and
      # Production run against the same Firebase project, so these roll out with
      # the Testing frontend and must stay backward compatible with whatever
      # frontend is currently live on production. See the expand/contract rules in
      # docs/FIREBASE_HOSTING_RUNBOOK.md before changing them.
      #
      # Rules + Storage first so an indexes IAM issue does not block rule rollouts.
      - name: Deploy Firestore rules and Storage rules
        run: npx firebase deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy Firestore indexes
        run: npx firebase deploy --only firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive

  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs:
      - release-validation
    # Cloud Functions are shared backend, not a frontend channel: there is one
    # deployment of them serving both Testing and Production. They therefore roll
    # out with the Testing frontend and must remain backward compatible with the
    # frontend currently live on production — a promotion never redeploys them.
    #
    # See `deploy-testing` for why `!cancelled()` and the `release-validation`
    # clause have to appear together, and what happens when they do not.
    if: >-
      !cancelled() &&
      github.repository == 'Khomurod/SafeHaul' &&
      needs.release-validation.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: firebase-functions-live
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      # Reads the Testing release records to find the last commit whose deploy
      # was confirmed successful. See "Resolve the incremental deploy base".
      deployments: read
    env:
      FIREBASE_PROJECT_ID: truckerapp-system

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/725898258453/locations/global/workloadIdentityPools/safehaul-github/providers/safehaul-github-provider
          service_account: safehaul-github-deployer@truckerapp-system.iam.gserviceaccount.com
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      # Root lockfile pins firebase-tools; without this, npx downloads a random CLI each run.
      - name: Install repo dependencies (Firebase CLI from package-lock)
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./functions

      # Legacy trigger removed from driverSync.js — Cloud still had it; deploy --non-interactive refuses to delete without confirmation.
      # Safe to ignore failure once the function is already gone (continue-on-error).
      - name: Delete retired function onLeadSubmitted (if present)
        continue-on-error: true
        run: npx firebase functions:delete onLeadSubmitted --region us-central1 --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      - name: Validate function export wiring parser
        run: npm run check:function-exports

      - name: Validate incremental deploy planner behavior
        run: npm run check:deploy-script

      # WHICH COMMIT "CHANGED" IS MEASURED FROM.
      #
      # This used to be `github.event.before` — the previous push — and that is
      # only correct while every push deploys. When one does not, its window is
      # never revisited: the next push measures from the commit that failed, so
      # the functions it changed are never deployed. CI stays green and the
      # callable simply does not exist.
      #
      # It happened: `surveyHistoricalReconstruction` shipped in dc0dd23, that
      # merge's deploy died in a runner outage, and the function was still
      # missing from Cloud two merges later — a 404 the Super Admin panel
      # surfaced as "internal".
      #
      # So the base is now the last commit whose Testing release was CONFIRMED
      # successful, which only `release-ready` can record and only after both
      # deploy jobs pass. A failed deploy widens the next window instead of
      # dropping it. Falls back to the previous push if that cannot be read.
      - name: Resolve the incremental deploy base
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PUSH_BEFORE: ${{ github.event.before }}
        run: node scripts/resolve-deploy-base.mjs

      # Incremental strict mode: deploy only changed/mapped runtime functions.
      # Never auto-full-deploy; explicit full deploy requires DEPLOY_FUNCTIONS_FORCE_FULL=1.
      - name: Deploy Cloud Functions (incremental or full)
        env:
          GITHUB_PUSH_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_FUNCTIONS_SLEEP_SEC: '0'
          # The three release callables are always redeployed, for the same
          # reason the others on this list are: a Functions deploy PINS each
          # bound secret to the version that existed at deploy time
          # (`secretKeyRef.key: '3'`, not `latest`). So rotating the GitHub App
          # key in Secret Manager changes nothing at runtime until these
          # functions are deployed again — and the incremental planner would not
          # redeploy them, because rotating a credential touches no source file.
          #
          # Discovered the hard way: they first shipped bound to a placeholder
          # version, and the Releases screen correctly reported "not connected"
          # while the real credential sat unused one version above it.
          #
          # `surveyHistoricalReconstruction` is here for a different reason, and
          # is RECOVERY rather than policy. It was added in dc0dd23, whose
          # deploy failed, so it was orphaned by the narrow-window bug that the
          # "Resolve the incremental deploy base" step above now fixes. That fix
          # cannot rescue it retroactively — a52b9ba is already recorded as a
          # successful deploy, so the new base sits *after* the orphaned commit.
          # Forcing it here is what actually gets it to Cloud. Remove this entry
          # when the temporary Historical Records panel is retired.
          DEPLOY_FUNCTIONS_ALWAYS_INCLUDE: parseCdlWithGroq,analyzeEdocFieldPlacement,initBulkSession,processBulkBatch,getReleaseStatus,promoteTestingToProduction,rollbackProductionRelease,surveyHistoricalReconstruction
        run: |
          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Deploy attempt $attempt/$max_attempts"
            if node scripts/deploy-functions-incremental.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Deploy failed after $max_attempts attempts."
              exit 1
            fi
            echo "Transient deploy failure; retrying in 20 seconds..."
            sleep 20
            attempt=$((attempt + 1))
          done

      - name: Post-deploy smoke check
        run: node scripts/smoke-functions-deploy.mjs

  verify-shipped:
    name: Confirm the release actually shipped
    runs-on: ubuntu-latest
    needs:
      - deploy-testing
      - deploy-functions
    # THE ONE JOB BELOW THE GATE THAT MUST RUN WHEN ITS DEPENDENCIES DID NOT.
    #
    # Every other job here is written to stay out of the way unless the things it
    # depends on succeeded. This one is the opposite: a deploy that was skipped or
    # failed is exactly what it exists to report. So it makes no demand of its
    # `needs` here — the demand lives in `scripts/verify-shipped.mjs`, in code that
    # is unit-tested, instead of in a YAML condition that can quietly evaluate to
    # "don't bother". `scripts/test-ci-plan.mjs` asserts that split deliberately.
    #
    # It answers the question a green run never used to answer: did anything
    # actually reach users? On a60c6dc the answer was no, for four hours, while
    # every check was green.
    if: >-
      !cancelled() &&
      github.repository == 'Khomurod/SafeHaul' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      # 1. Did the deploy jobs run at all?
      - name: Confirm both deploys ran
        env:
          DEPLOY_TESTING_RESULT: ${{ needs.deploy-testing.result }}
          DEPLOY_FUNCTIONS_RESULT: ${{ needs.deploy-functions.result }}
        run: node scripts/verify-shipped.mjs

      # 2. Is the site really serving this commit? A successful `firebase` exit
      # code says the CLI accepted the work, not that the CDN is handing the new
      # bundle to users. This reads `release.json` back off the live origin — the
      # same file anyone can curl — and already retries past propagation.
      - name: Confirm Testing is serving this commit
        run: node scripts/verify-live-release.mjs https://truckerapp-system.web.app "$GITHUB_SHA"

  release-ready:
    name: Confirm the release is ready
    runs-on: ubuntu-latest
    # THE eligibility point for the entire release system.
    #
    # `deploy-testing` records the release as `in_progress`; only this job marks
    # it `success`, and only `success` lets `promote-production.yml` (or the
    # Super Admin Promote button) touch app.safehaul.io.
    #
    # Both deploy jobs are in `needs:`, so this cannot start until the Testing
    # frontend AND the shared backend — Cloud Functions, Firestore rules, Storage
    # rules, indexes, post-deploy smoke — have all succeeded. Testing and
    # Production share that backend, so a frontend whose Function or rule never
    # shipped must never become promotable. And because both deploy jobs sit
    # behind `release-validation`, neither can have run unless every test lane
    # was executed or provably covered for this exact source tree.
    #
    # Every failure mode leaves the release un-promotable: a failed deploy skips
    # this job, a cancelled run never reaches it, and a missing deployment id
    # fails it. It is closed by default and opened only by success.
    needs:
      - deploy-testing
      - deploy-functions
      - verify-shipped
    # Same pairing as the deploy jobs, and for the same reason: the skip that
    # starts at a proven lane keeps propagating down the chain even past jobs
    # that opted out of it, so without `!cancelled()` this job is skipped and the
    # release is never marked promotable — which is what e0d1b0f did, with both
    # deploys green above it.
    #
    # `!cancelled()` also switches off the implicit "all needs succeeded" rule,
    # and THIS job is the one where that rule was doing the real work: it is what
    # stopped a release being declared promotable when a deploy failed. So every
    # dependency is demanded explicitly. Marking a release ready when the shared
    # backend did not ship is the single worst thing this workflow could do, so
    # it is stated rather than inherited.
    #
    # `verify-shipped` is in that list because "deployed" and "actually live" are
    # different claims, and only the second one is worth promoting.
    if: >-
      !cancelled() &&
      github.repository == 'Khomurod/SafeHaul' &&
      needs.deploy-testing.result == 'success' &&
      needs.deploy-functions.result == 'success' &&
      needs.verify-shipped.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      - name: Mark the Testing release promotable
        env:
          DEPLOYMENT_ID: ${{ needs.deploy-testing.outputs.deployment_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/mark-release-ready.mjs
