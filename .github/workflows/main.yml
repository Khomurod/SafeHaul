name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history so Gitleaks can resolve base..head (merge pushes need both parents' ancestry).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./functions

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linting
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Frontend Lint
        run: npm run lint:frontend

      - name: Frontend Unit Tests + Coverage (baseline-ratchet gate)
        run: npm run test:coverage

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E Tests (Chromium)
        # Exclude the @a11y axe lane here; it runs in the non-blocking e2e-a11y job.
        run: npm run test:e2e -- --project=chromium --grep-invert "@a11y"

  storybook-build:
    name: Build the design-system catalog
    runs-on: ubuntu-latest
    # The Storybook catalog documents the design system and business-neutral page
    # patterns only. It imports no Firebase, no application context and no domain
    # services, and every value it renders comes from hand-written local fixtures.
    #
    # So this job is deliberately given NO credentials: the workflow-level VITE_*
    # secrets are blanked below rather than inherited. That is the guarantee, not
    # a precaution — if this build ever starts needing a secret, something has
    # been imported into the catalog that does not belong there, and this job
    # failing is the correct outcome.
    env:
      VITE_FIREBASE_API_KEY: ''
      VITE_FIREBASE_AUTH_DOMAIN: ''
      VITE_FIREBASE_PROJECT_ID: ''
      VITE_FIREBASE_STORAGE_BUCKET: ''
      VITE_FIREBASE_MESSAGING_SENDER_ID: ''
      VITE_FIREBASE_APP_ID: ''
      VITE_FACEBOOK_APP_ID: ''
      VITE_SENTRY_DSN: ''
      VITE_SUPER_ADMIN_EMAIL: ''
      VITE_DRIVER_APP_URL: ''
      VITE_SOCRATA_APP_TOKEN: ''
      PROCESS_BULK_BATCH_URL: ''
      BULK_WORKER_SECRET: ''
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      # `npm ci` (not `npm install`) so the catalog is built from the committed
      # lockfile and cannot drift from what was reviewed.
      - name: Install Dependencies
        run: npm ci

      # `storybook build` bundles stories but does not execute them, so a story
      # that throws at render would still produce a green build. This step renders
      # every story and runs axe over it, and guards against the story glob
      # silently resolving to nothing.
      - name: Story render + accessibility checks
        run: npm run test:stories

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload the static catalog
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 14
          if-no-files-found: error

  e2e-a11y:
    runs-on: ubuntu-latest
    # E3: automated accessibility gate (@axe-core/playwright) on the mobile-critical
    # journeys. Initially NON-BLOCKING (continue-on-error) and intentionally absent
    # from the deploy jobs' needs:, because it could not be verified in the dev
    # sandbox (browser download blocked). Once confirmed green in CI, fold these
    # tests back into the blocking Frontend E2E step (drop the --grep-invert) and
    # remove this job.
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium
      - name: E2E accessibility (axe) — non-blocking baseline
        run: npm run test:e2e -- --project=chromium --grep "@a11y"
        continue-on-error: true

  typecheck:
    runs-on: ubuntu-latest
    # D3: non-blocking type-safety baseline (checkJs on scoped high-leverage
    # modules via jsconfig.json). Surfaces latent type issues to ratchet over
    # time; intentionally NOT listed in the deploy jobs' `needs:` so it never
    # blocks a release.
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Typecheck (non-blocking baseline)
        run: npm run typecheck
        continue-on-error: true

  callable-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
      - name: Verify frontend/backend callable contract
        run: node scripts/check-callable-contract.mjs

      # The promotion gate decides what may reach app.safehaul.io, so its refusal
      # paths are a required check rather than a nicety.
      - name: Verify the production-promotion gate
        run: npm run check:release-scripts

  rules-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Firebase emulator jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install Dependencies
        run: npm ci

      - name: Run Firestore/Storage rules tests with emulators (5x flake guard)
        env:
          RULES_STRESS_LOOPS: '5'
        run: npm run test:rules:stress

      - name: Upload emulator logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rules-emulator-logs
          if-no-files-found: ignore
          path: |
            firestore-debug.log
            firebase-debug.log
            storage-debug.log
            ui-debug.log

  deploy-testing:
    name: Deploy the Testing release
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - test-functions
      - frontend-build
      - frontend-quality
      - storybook-build
      - callable-contract
      - rules-emulator
    # SafeHaul has exactly one active source repository. The deploy jobs used to
    # pick their Hosting target from `github.repository`, because the same files
    # lived in two repositories and each deployed its own pair of sites. That is
    # retired: `Khomurod/SafeHaul` is now the only repository that may deploy,
    # and a merge to its `main` only ever updates the TESTING channel.
    #
    # The repository guard is deliberately an `if:` on the job rather than a note
    # in a runbook. `SafeHaul-for-Gemini-Antigravity` keeps this workflow file in
    # its history, so without the guard someone could still open that archived
    # repository and press "Run workflow" to deploy from stale source. With it,
    # those jobs skip immediately and no Google credential is ever requested.
    if: >-
      github.repository == 'Khomurod/SafeHaul' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    concurrency:
      # Serialised against itself, but NOT against a production promotion — the
      # two touch different Hosting sites and must not cancel one another.
      group: firebase-hosting-testing
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      # Records the release (and its pinned Hosting version IDs) that a later
      # production promotion is allowed to copy.
      deployments: write
    env:
      FIREBASE_PROJECT_ID: truckerapp-system
      FIREBASE_HOSTING_TARGET: testing
      FIREBASE_LANDING_TARGET: landing-testing

    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/725898258453/locations/global/workloadIdentityPools/safehaul-github/providers/safehaul-github-provider
          service_account: safehaul-github-deployer@truckerapp-system.iam.gserviceaccount.com
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          # Needed to read back the Hosting version ID that this deploy created.
          # Keyless: minted from the same WIF exchange, no service-account JSON.
          token_format: access_token

      - name: Load browser settings from Google Secret Manager
        id: browser-settings
        uses: google-github-actions/get-secretmanager-secrets@v3
        with:
          secrets: |-
            VITE_FACEBOOK_APP_ID:truckerapp-system/VITE_FACEBOOK_APP_ID
            VITE_SENTRY_DSN:truckerapp-system/VITE_SENTRY_DSN
            VITE_SOCRATA_APP_TOKEN:truckerapp-system/VITE_SOCRATA_APP_TOKEN

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend
        env:
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_FACEBOOK_APP_ID: ${{ steps.browser-settings.outputs.VITE_FACEBOOK_APP_ID }}
          VITE_SENTRY_DSN: ${{ steps.browser-settings.outputs.VITE_SENTRY_DSN }}
          VITE_SOCRATA_APP_TOKEN: ${{ steps.browser-settings.outputs.VITE_SOCRATA_APP_TOKEN }}
        run: npm run build

      # E1: Never publish *.map files to Firebase Hosting (no public source disclosure).
      # Runs unconditionally, after any upload and before deploy.
      - name: Strip sourcemaps from deploy artifact
        run: find dist -name '*.map' -delete

      # A promotion has to prove *which source* produced the bytes it is about to
      # copy to production. `VITE_RELEASE_SHA` is compiled into the bundle, which
      # is not readable without parsing hashed chunks, so the same value is also
      # written as a plain static file. It is served by the deployed site itself,
      # which makes the currently-live SHA independently checkable by anyone —
      # the promotion workflow, the runbook, or a human with curl.
      - name: Stamp the release manifest
        run: node scripts/write-release-manifest.mjs dist testing "$GITHUB_SHA"

      - name: Deploy app and landing-page Hosting sites
        run: npx firebase deploy --only "hosting:$FIREBASE_HOSTING_TARGET,hosting:$FIREBASE_LANDING_TARGET" --project "$FIREBASE_PROJECT_ID" --non-interactive

      # Capture the immutable Hosting version IDs this deploy just created.
      #
      # This is what makes "promote the exact tested build" true rather than
      # aspirational. Firebase Hosting versions are immutable, so pinning the ID
      # here means a promotion later clones *these* bytes even if `main` has moved
      # on and Testing has been redeployed several times in between.
      - name: Record the deployed Testing version IDs
        id: versions
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          node scripts/read-hosting-release.mjs truckerapp-system app >> "$GITHUB_OUTPUT"
          node scripts/read-hosting-release.mjs safehaul-landing-testing landing >> "$GITHUB_OUTPUT"

      - name: Publish the release record
        env:
          APP_VERSION_ID: ${{ steps.versions.outputs.app_version_id }}
          LANDING_VERSION_ID: ${{ steps.versions.outputs.landing_version_id }}
          RELEASE_CHANNEL: testing
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/record-release.mjs

      # Rules, Storage and indexes are SHARED backend policy: Testing and
      # Production run against the same Firebase project, so these roll out with
      # the Testing frontend and must stay backward compatible with whatever
      # frontend is currently live on production. See the expand/contract rules in
      # docs/FIREBASE_HOSTING_RUNBOOK.md before changing them.
      #
      # Rules + Storage first so an indexes IAM issue does not block rule rollouts.
      - name: Deploy Firestore rules and Storage rules
        run: npx firebase deploy --only firestore:rules,storage --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Deploy Firestore indexes
        run: npx firebase deploy --only firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive

  deploy-functions:
    name: Deploy Cloud Functions
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - test-functions
      - frontend-build
      - frontend-quality
      - storybook-build
      - callable-contract
      - rules-emulator
    # Cloud Functions are shared backend, not a frontend channel: there is one
    # deployment of them serving both Testing and Production. They therefore roll
    # out with the Testing frontend and must remain backward compatible with the
    # frontend currently live on production — a promotion never redeploys them.
    if: >-
      github.repository == 'Khomurod/SafeHaul' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    concurrency:
      group: firebase-functions-live
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: truckerapp-system

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/725898258453/locations/global/workloadIdentityPools/safehaul-github/providers/safehaul-github-provider
          service_account: safehaul-github-deployer@truckerapp-system.iam.gserviceaccount.com
          project_id: ${{ env.FIREBASE_PROJECT_ID }}

      # Root lockfile pins firebase-tools; without this, npx downloads a random CLI each run.
      - name: Install repo dependencies (Firebase CLI from package-lock)
        run: npm ci

      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./functions

      # Legacy trigger removed from driverSync.js — Cloud still had it; deploy --non-interactive refuses to delete without confirmation.
      # Safe to ignore failure once the function is already gone (continue-on-error).
      - name: Delete retired function onLeadSubmitted (if present)
        continue-on-error: true
        run: npx firebase functions:delete onLeadSubmitted --region us-central1 --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      - name: Validate function export wiring parser
        run: npm run check:function-exports

      - name: Validate incremental deploy planner behavior
        run: npm run check:deploy-script

      # Incremental strict mode: deploy only changed/mapped runtime functions.
      # Never auto-full-deploy; explicit full deploy requires DEPLOY_FUNCTIONS_FORCE_FULL=1.
      - name: Deploy Cloud Functions (incremental or full)
        env:
          GITHUB_PUSH_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          DEPLOY_FUNCTIONS_SLEEP_SEC: '0'
          DEPLOY_FUNCTIONS_ALWAYS_INCLUDE: parseCdlWithGroq,analyzeEdocFieldPlacement,initBulkSession,processBulkBatch
        run: |
          max_attempts=3
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Deploy attempt $attempt/$max_attempts"
            if node scripts/deploy-functions-incremental.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Deploy failed after $max_attempts attempts."
              exit 1
            fi
            echo "Transient deploy failure; retrying in 20 seconds..."
            sleep 20
            attempt=$((attempt + 1))
          done

      - name: Post-deploy smoke check
        run: node scripts/smoke-functions-deploy.mjs
