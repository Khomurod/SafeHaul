name: Production Readiness Gate

on:
  workflow_dispatch:

jobs:
  verify-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js 20.x
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci
        working-directory: ./functions

      - name: Frontend lint
        run: npm run lint:frontend

      - name: Frontend unit tests
        run: npm test -- --run

      - name: Functions lint
        run: npm run lint
        working-directory: ./functions

      - name: Functions unit tests
        run: npm test
        working-directory: ./functions

      - name: Callable contract check
        run: node scripts/check-callable-contract.mjs

  final-gate-checklist:
    runs-on: ubuntu-latest
    needs: verify-quality
    steps:
      - name: Final gate reminder
        run: |
          echo "Run full-scale re-audit before production signoff."
          echo "Required hard tests:"
          echo "1) Security regression suite"
          echo "2) Abuse and load testing"
          echo "3) Failure-injection and rollback simulation"
          echo "4) End-to-end UAT signoff"
