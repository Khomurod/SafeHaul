# Secret-scanning configuration, used by BOTH scans in `scripts/secret-scan.mjs`
# (the commit range and the exported source tree) and by the separate
# `secret-history-audit` workflow. Passed explicitly with `--config`, so which
# file is in force is never inferred from a working directory.
title = "SafeHaul"

[extend]
useDefault = true

# ## There are no path exemptions, deliberately
#
# This section used to allowlist `\.env\.example$` and `functions/\.env\.example$`
# on the theory that their placeholder values tripped rules. Measured against the
# pinned gitleaks 8.30.1 on 2026-08-26, that is not true:
#
#   - the tracked tree scanned with the path list removed: identical result;
#   - all three commits in the repository's history that ever touched either
#     template, scanned individually with the path list removed: 0 findings.
#
# So the exemption bought nothing and cost the only thing that matters — a real
# credential pasted into a file called `.env.example` would have been ignored.
# Deleted rather than kept "just in case". A path exemption is the widest kind
# there is, and this file now has none.
[allowlist]
description = "Two value exemptions. No path is exempt, and no rule is switched off."
# Every entry below is a value that *cannot* be a credential, and says why.
# Because neither exempts a file nor disables a rule, a real secret in the same
# file — even on the same line — is still reported. Both were re-verified against
# gitleaks 8.30.1 when the scanner was pinned: removing them makes exactly the
# three known non-findings reappear (`src/lib/firebase/config.js` once,
# `BlogPostsView.contract.test.jsx` twice) and nothing else changes.
#
# ## 1. The Firebase placeholder key
#
# `src/lib/firebase/config.js` ships a hardcoded placeholder Firebase config so
# local dev and E2E can boot without credentials. It points at the non-existent
# project `safehaul-e2e`; the "key" has never been valid for anything. The
# string is matched exactly, so a real `AIza...` key in the same file would
# still be reported.
#
# It needs allowlisting because the commit-range scan reads diffs: the literal
# has been on `main` since the placeholder branch was introduced, but any commit
# that moves the line re-adds it and trips `gcp-api-key`/`generic-api-key` on
# entropy alone. The tree scan sees it on every run for the same reason.
#
# ## 2. A blog publication slot id — a date and a theme name
#
# `blog_runs` documents are keyed `{publicationDate}_{themeId}` — the same pair
# that makes `create()` the anti-double-publish guarantee — and the field is
# called `slotKey`. That is enough for the default `generic-api-key` rule: the
# identifier ends in `key`, and `2026-08-02_safehaul-education` clears the
# entropy threshold at 4.06.
#
# Allowlisted by *shape* rather than as two exact literals, unlike the Firebase
# placeholder above, because entropy alone decides which values trip it: in the
# same fixture `2026-08-02_industry-news` passes while `2026-08-02_recruitment`
# does not, so pinning today's literals would leave the next theme name to fail
# the build for the same non-reason. The pattern is anchored and lowercase-only,
# so a secret has to be *exactly* a date followed by a hyphenated slug to match —
# no credential format can be. `scripts/test-secret-scan.mjs` proves both halves:
# the placeholder shape is allowed, and a real-shaped key sitting next to it in
# the same file is still detected.
regexes = [
  '''AIzaSyE2EPlaceholderKey1234567890123''',
  '''^\d{4}-\d{2}-\d{2}_[a-z][a-z0-9-]*$''',
]
